<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Kit Forge — конструктор игрового UI</title>
<!--
  Standalone editor tool, served verbatim from `public/` at /tools/uikit-forge.html.

  It is deliberately NOT part of the editor bundle: it is a self-contained vanilla page with its
  own DOM ids and globals, needs no project and no editor services, and the editor embeds it as a
  same-origin iframe from the `#uikit` route (see `src/ui/tools/pix3-uikit-forge.ts`). Same-origin
  is load-bearing — the export path uses `showDirectoryPicker()` and anchor downloads, which a
  cross-origin or sandboxed frame would block.

  Updated by re-copying the authored page over this file; keep this comment when you do.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fredoka:wght@700&family=Lilita+One&family=Luckiest+Guy&family=Nunito:wght@900&family=Rubik:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171d29; --panel:#1f2735; --panel2:#252f40; --line:#313d52;
    --txt:#dbe4f2; --dim:#8593ab; --acc:#ffc935; --acc-dim:#8a6d1c;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font:13px/1.45 "Segoe UI", system-ui, sans-serif;
    background:var(--bg); color:var(--txt);
    display:flex; overflow:hidden;
  }
  /* ---------- левая панель настроек ---------- */
  aside{
    width:344px; min-width:344px; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
  }
  aside h1{
    font-size:15px; letter-spacing:.3px; padding:14px 16px 10px;
    display:flex; align-items:center; gap:8px;
  }
  aside h1 .dot{width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 2px 0 #b8860b}
  .controls{flex:1; overflow-y:auto; padding:4px 16px 16px}
  .grp{margin-top:14px}
  .grp>b{display:block; font-size:11px; color:var(--dim); font-weight:600; margin-bottom:6px; letter-spacing:.4px}
  .row{display:flex; align-items:center; gap:8px; margin:5px 0}
  .row label{flex:0 0 96px; color:var(--txt); font-size:12px}
  .row input[type=range]{flex:1; accent-color:var(--acc); height:18px}
  .row output{flex:0 0 44px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px}
  .row select{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .row input[type=checkbox]{accent-color:var(--acc); width:15px; height:15px}
  .row .cb-label{flex:1; font-size:12px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer;
    transition:filter .1s;
  }
  .btn:hover{filter:brightness(1.15)}
  .btn.primary{background:var(--acc); border-color:#c79a20; color:#3a2c00}
  .btn.wide{width:100%}
  .btnrow{display:flex; gap:8px; margin-top:8px}
  .btnrow .btn{flex:1}
  /* ---------- основная область ---------- */
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  header{
    display:flex; align-items:center; gap:4px; padding:10px 14px 0;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .tab{
    padding:8px 14px 10px; cursor:pointer; color:var(--dim); font-size:13px; font-weight:600;
    border-bottom:2px solid transparent; user-select:none; white-space:nowrap;
  }
  .tab:hover{color:var(--txt)}
  .tab.on{color:var(--acc); border-bottom-color:var(--acc)}
  header .spacer{flex:1}
  #stageWrap{flex:1; overflow:auto; position:relative}
  #stage{
    min-height:100%; padding:26px;
    display:flex; flex-wrap:wrap; gap:22px; align-content:flex-start;
  }
  #stage.bg-game{background:linear-gradient(180deg,#0a5aa0 0%,#083b6e 100%)}
  #stage.bg-dark{background:#12151d}
  #stage.bg-checker{
    background:
      linear-gradient(45deg,#2a2f3c 25%,transparent 25%,transparent 75%,#2a2f3c 75%) 0 0/24px 24px,
      linear-gradient(45deg,#2a2f3c 25%,transparent 25%,transparent 75%,#2a2f3c 75%) 12px 12px/24px 24px,
      #1c202b;
  }
  .card{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px}
  .card .cv{display:flex; align-items:center; justify-content:center}
  .card .nm{
    font-size:10px; color:rgba(255,255,255,.55); font-family:ui-monospace,Consolas,monospace;
    background:rgba(0,0,0,.28); padding:2px 7px; border-radius:5px;
    display:flex; gap:6px; align-items:center;
  }
  #stage.bg-checker .card .nm, #stage.bg-dark .card .nm{color:#93a0b8}
  .card .nm a{color:var(--acc); cursor:pointer; text-decoration:none}
  .card .nm a:hover{text-decoration:underline}
  footer{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-top:1px solid var(--line); background:var(--panel);
  }
  footer .hint{color:var(--dim); font-size:11px; margin-left:auto; max-width:520px}
  #toast{
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%) translateY(20px);
    background:#0d1117; border:1px solid var(--line); color:var(--txt);
    padding:9px 16px; border-radius:8px; opacity:0; pointer-events:none;
    transition:.25s; font-size:12px; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  /* оверлей занятости */
  #busy{
    position:fixed; inset:0; background:rgba(9,13,21,.62); backdrop-filter:blur(2px);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:100;
  }
  #busy.show{display:flex}
  .spinner{
    width:48px; height:48px; border-radius:50%;
    border:5px solid rgba(255,255,255,.14); border-top-color:var(--acc);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #busyMsg{color:var(--txt); font-size:13px; max-width:70%; text-align:center}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#39455c;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<aside>
  <h1><span class="dot"></span>UI Kit Forge</h1>
  <div class="controls" id="controls"></div>
  <div style="padding:12px 16px;border-top:1px solid var(--line)">
    <div class="btnrow">
      <button class="btn" id="btnRandom">🎲 Рандом</button>
      <button class="btn" id="btnReset">↺ Сброс</button>
    </div>
    <div class="btnrow">
      <button class="btn" id="btnThemeCopy">⧉ Тема JSON</button>
      <button class="btn" id="btnThemePaste">⇩ Вставить</button>
    </div>
  </div>
</aside>

<main>
  <header id="tabs"></header>
  <div id="stageWrap"><div id="stage" class="bg-game"></div></div>
  <footer>
    <label style="color:var(--dim);font-size:12px">Масштаб экспорта</label>
    <select id="expScale" class="btn" style="padding:6px 8px">
      <option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option>
    </select>
    <button class="btn primary" id="btnAtlas">⬇ PNG-атлас + JSON</button>
    <button class="btn" id="btnAllSvg">⬇ SVG в папку</button>
    <button class="btn" id="btnHtml">⬇ HTML</button>
    <span class="hint">Атлас в формате TexturePacker JSON-hash — грузится напрямую в Phaser
      (<code>load.atlas</code>), PixiJS (<code>Assets.load</code>), Cocos и др. У каждой карточки — ссылки SVG / PNG.</span>
  </footer>
</main>

<div id="toast"></div>
<div id="busy"><div class="spinner"></div><div id="busyMsg">Генерация…</div></div>

<script>
"use strict";
/* ============================================================
   UI Kit Forge — параметрический генератор игрового UI на SVG
   ============================================================ */

/* ---------- цветовые утилиты ---------- */
function hexToHsl(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16)/255, g=parseInt(hex.slice(2,4),16)/255, b=parseInt(hex.slice(4,6),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){
    const d=mx-mn;
    s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    switch(mx){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      default: h=(r-g)/d+4;
    }
    h*=60;
  }
  return [h, s*100, l*100];
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360; s=Math.min(100,Math.max(0,s))/100; l=Math.min(100,Math.max(0,l))/100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  const to=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+to(r)+to(g)+to(b);
}
function adj(hex,{dh=0,ds=0,dl=0}={}){
  const [h,s,l]=hexToHsl(hex);
  return hslToHex(h+dh, s+ds, l+dl);
}
function lum(hex){ return hexToHsl(hex)[2]; }

/* ---------- тема (глобальные параметры) ---------- */
const DEFAULT_THEME = {
  hue:0, sat:0, light:0,
  radius:7, bevel:5, outline:1.5, skew:0,
  glossOn:1, glossH:51, glossA:15,
  gradOn:0, gradK:11,
  shadowMode:0, shadowDx:3, shadowDy:6, shadowBlur:5, shadowA:40,
  font:"Nunito", txtOut:1, txtDrop:3, txtColor:"white",
  darkTone:"#15243c"   // тон обводок/тёмных панелей
};
let T = {...DEFAULT_THEME};

const FONTS = [
  {f:"Baloo 2", w:800}, {f:"Fredoka", w:700}, {f:"Lilita One", w:400},
  {f:"Luckiest Guy", w:400}, {f:"Nunito", w:900}, {f:"Rubik", w:800}
];
function fontW(){ const x=FONTS.find(o=>o.f===T.font); return x?x.w:800; }

/* базовая палитра (семантические цвета) */
const PALETTE = [
  {id:"sky",     hex:"#35aef2", label:"Sky"},
  {id:"blue",    hex:"#1f7fd6", label:"Blue"},
  {id:"green",   hex:"#43c11d", label:"Green"},
  {id:"yellow",  hex:"#ffc42e", label:"Select"},
  {id:"bluegray",hex:"#5c6577", label:"Blue Gray"},
  {id:"gray",    hex:"#8b8b95", label:"Gray"},
  {id:"white",   hex:"#ffffff", label:"White"},
  {id:"red",     hex:"#e5494b", label:"Red"},
  {id:"orange",  hex:"#f07d1f", label:"Orange"},
  {id:"purple",  hex:"#a43ddb", label:"Purple"},
];
/* применяем глобальные сдвиги темы к семантическому цвету */
function C(hexOrId){
  const p = PALETTE.find(p=>p.id===hexOrId);
  const hex = p ? p.hex : hexOrId;
  if(lum(hex)>92) return adj(hex,{dl:T.light*0.3}); // белый почти не трогаем
  return adj(hex,{dh:T.hue, ds:T.sat, dl:T.light});
}
function DARK(){ return adj(T.darkTone,{dh:T.hue*0.5}); }        // обводка/панели
function NAVY(){ return adj(T.darkTone,{dh:T.hue*0.5, dl:-4}); } // самый тёмный

/* ---------- примитивы SVG ---------- */
let _uid = 0;
function uid(p){ return p+(_uid++); }

function svgDoc(w,h,inner){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
}
/* вертикальный градиент: светлее сверху */
function vGrad(color){
  if(!T.gradOn) return {def:"", fill:color};
  const id = uid("g");
  const top = adj(color,{dl:+T.gradK*0.9, ds:+3});
  const bot = adj(color,{dl:-T.gradK*0.35});
  return {
    def:`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>`,
    fill:`url(#${id})`
  };
}
/* фирменный «пухлый» прямоугольник: обводка + тёмная губа снизу + лицо с градиентом + блик.
   При T.skew>0 вертикальные грани скашиваются (параллелограмм, как в Brawl Stars). */
function bevelRect(x,y,w,h,color,{r=null, bevel=null, gloss=true}={}){
  r = r??T.radius; bevel = bevel??T.bevel;
  let pre="", post="";
  const a = T.skew||0;
  if(a>0.1){
    const t = Math.tan(a*Math.PI/180);
    const inset = t*h/2;
    x += inset; w -= inset*2;               // ужимаем, чтобы скос не вылез за холст
    const cy = y+h/2;
    pre = `<g transform="matrix(1,0,${-t.toFixed(4)},1,${(t*cy).toFixed(2)},0)">`;
    post = `</g>`;
  }
  const ow = T.outline;
  const dark = adj(color,{dl:-17, ds:-4});
  const g = vGrad(color);
  const pad = ow;
  const fr = Math.max(0, r-pad);
  const fh = h - pad*2 - bevel;
  let s = g.def;
  s += `<rect x="${x+ow/2}" y="${y+ow/2}" width="${w-ow}" height="${h-ow}" rx="${r}" fill="${dark}" stroke="${DARK()}" stroke-width="${ow}"/>`;
  s += `<rect x="${x+pad}" y="${y+pad}" width="${w-pad*2}" height="${fh}" rx="${fr}" fill="${g.fill}"/>`;
  if(gloss && T.glossOn){
    const gh = fh * T.glossH/100;
    const gp = Math.max(2, fr*0.45);
    s += `<rect x="${x+pad+gp}" y="${y+pad+gp*0.7}" width="${w-pad*2-gp*2}" height="${Math.max(4,gh)}" rx="${Math.max(0,fr-gp)}" fill="#ffffff" opacity="${T.glossA/100}"/>`;
  }
  return pre + s + post;
}
/* полигон со скруглёнными углами (через толстый stroke c round join) */
function roundedPoly(pts, color, {cr=6, outline=true, translate="", fillOverride=null}={}){
  const d = "M"+pts.map(p=>p[0]+","+p[1]).join("L")+"Z";
  const ow = T.outline;
  let s = "";
  if(outline){
    s += `<path d="${d}" fill="${DARK()}" stroke="${DARK()}" stroke-width="${(cr+ow)*2}" stroke-linejoin="round" ${translate}/>`;
  }
  const fill = fillOverride || color;
  s += `<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="${cr*2}" stroke-linejoin="round" ${translate}/>`;
  return s;
}
/* текст в игровом стиле: тень вниз + обводка + заливка.
   Тёмный текст (T.txtColor='dark' или тёмный fill) — без обводки и тени, как в Bombastic Brothers.
   При STRIP_TEXT=true (PNG-экспорт) текст не рисуется — его в игре выводит движок. */
let STRIP_TEXT = false;
function label(x,y,text,size,{fill=null, anchor="middle", outScale=1}={}){
  if(STRIP_TEXT) return "";
  const fam = `'${T.font}', 'Baloo 2', sans-serif`;
  const resolved = fill || (T.txtColor==="dark" ? adj(DARK(),{dl:-3}) : "#ffffff");
  const common = `x="${x}" y="${y}" font-family="${fam}" font-weight="${fontW()}" font-size="${size}" text-anchor="${anchor}" dominant-baseline="middle"`;
  if(lum(resolved) < 45){
    return `<text ${common} fill="${resolved}">${text}</text>`;
  }
  const ow = T.txtOut * (size/30) * outScale;
  const drop = T.txtDrop * (size/30);
  let s = "";
  if(drop>0.2) s += `<text ${common} transform="translate(0,${drop.toFixed(1)})" fill="${DARK()}" stroke="${DARK()}" stroke-width="${ow*2}" stroke-linejoin="round" paint-order="stroke">${text}</text>`;
  s += `<text ${common} fill="${resolved}" stroke="${DARK()}" stroke-width="${ow*2}" stroke-linejoin="round" paint-order="stroke">${text}</text>`;
  return s;
}

/* ---------- векторные иконки (белые с тёмной обводкой) ---------- */
function iconStroke(paths, cx, cy, size, {sw=2.6, fillMode=false, color="#ffffff"}={}){
  // paths: массив path d в системе 24×24.
  // Обводка и тень масштабируются так же, как у текста (T.txtOut / T.txtDrop):
  // для текста ow = txtOut*(size/30), тут пересчёт в координаты 24×24.
  const k = size/24;
  const ow = T.txtOut * 1.6;      // = txtOut*(size/30)*2 / k
  const drop = T.txtDrop * 0.8;   // = txtDrop*(size/30) / k
  const inner = paths.map(d=>`<path d="${d}"/>`).join("");
  const darkA = fillMode
    ? `fill="${DARK()}" stroke="${DARK()}" stroke-width="${sw+ow}" stroke-linejoin="round" stroke-linecap="round"`
    : `fill="none" stroke="${DARK()}" stroke-width="${sw+ow}" stroke-linejoin="round" stroke-linecap="round"`;
  const mainA = fillMode
    ? `fill="${color}" stroke="${color}" stroke-width="${Math.max(0.4,sw*0.6)}" stroke-linejoin="round" stroke-linecap="round"`
    : `fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
  let g = "";
  if(drop>0.15) g += `<g ${darkA} transform="translate(0,${drop.toFixed(2)})">${inner}</g>`;
  g += `<g ${darkA}>${inner}</g><g ${mainA}>${inner}</g>`;
  return `<g transform="translate(${cx-12*k},${cy-12*k}) scale(${k})">${g}</g>`;
}
function gearD(){
  // генерируем шестерёнку
  const teeth=8, r1=10.5, r2=7.6, cx=12, cy=12;
  let d="";
  for(let i=0;i<teeth*2;i++){
    const a=(i/(teeth*2))*Math.PI*2 - Math.PI/2;
    const r=(i%2===0)?r1:r2;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    d+=(i===0?"M":"L")+x.toFixed(2)+","+y.toFixed(2);
  }
  d+="Z M12,8.6 a3.4,3.4 0 1,0 0.001,0 Z";
  return d;
}
const ICONS = {
  gear:   {d:[gearD()], fill:true, sw:1},
  play:   {d:["M8.5 5.5 L18.5 12 L8.5 18.5 Z"], fill:true, sw:1.5},
  refresh:{d:["M18.4 8.2 A7.4 7.4 0 1 0 19.4 12","M18.9 3.6 L18.9 8.6 L13.9 8.6"], sw:3},
  exit:   {d:["M13 4 H6 V20 H13","M11 12 H21","M17.6 8.4 L21 12 L17.6 15.6"], sw:3},
  trash:  {d:["M5.5 7 H18.5","M9 7 V4.5 H15 V7","M7 7 L8 20 H16 L17 7","M10.5 10.5 V16.5","M13.5 10.5 V16.5"], sw:2.6},
  close:  {d:["M6.5 6.5 L17.5 17.5","M17.5 6.5 L6.5 17.5"], sw:4},
  left:   {d:["M14.5 5.5 L8 12 L14.5 18.5"], sw:4.4},
  right:  {d:["M9.5 5.5 L16 12 L9.5 18.5"], sw:4.4},
  plus:   {d:["M12 4.5 V19.5","M4.5 12 H19.5"], sw:4.6},
  lock:   {d:["M7 11 H17 V19 H7 Z","M9 11 V8 a3 3 0 0 1 6 0 V11"], sw:2.8},
  check:  {d:["M5 12.5 L10 17.5 L19 6.5"], sw:4.6},
  minus:  {d:["M5 12 H19"], sw:4.6},
  swords: {d:["M4.5 4.5 L15 15 M15 15 L18 14 M15 15 L14 18","M19.5 4.5 L9 15 M9 15 L6 14 M9 15 L10 18","M17 17 L19.5 19.5","M7 17 L4.5 19.5"], sw:2.6},
  map:    {d:["M4 6 L9.3 4.2 L14.6 6 L20 4.2 V18 L14.6 19.8 L9.3 18 L4 19.8 Z","M9.3 4.2 V18","M14.6 6 V19.8"], sw:2},
  bolt:   {d:["M13 2.5 L5.5 13.5 H11 L9.5 21.5 L18.5 9.5 H12.5 Z"], fill:true, sw:1},
  sound:  {d:["M5 9.5 H8.5 L13.5 5 V19 L8.5 14.5 H5 Z","M16.5 9 A5 5 0 0 1 16.5 15"], fill:false, sw:2.4},
  film:   {d:["M4 6 H20 V18 H4 Z","M4 9.5 H20","M8 6 L10 9.5","M13 6 L15 9.5","M18 6 L20 9.5","M9.8 12 L14 14 L9.8 16 Z"], sw:2},
};
function icon(name, cx, cy, size, color){
  const i = ICONS[name];
  return iconStroke(i.d, cx, cy, size, {sw:i.sw||2.6, fillMode:!!i.fill, color: color||"#ffffff"});
}

/* ---------- генераторы компонентов ---------- */

function compButton(colorId, text, w=250, h=88){
  const c = C(colorId);
  const white = lum(c)>82;
  let s = bevelRect(0.5,0.5,w-1,h-1,c);
  s += label(w/2, h/2-T.bevel/3, text, h*0.38, white? {fill:DARK()} : {});
  return {svg:svgDoc(w,h,s), w, h};
}

function compBannerButton(colorId, text, w=250, h=88){
  const c = C(colorId);
  const n = h*0.28, cr = Math.min(10, T.radius*0.6);
  const pts=[[n,0],[w-n,0],[w,h/2],[w-n,h],[n,h],[0,h/2]].map(p=>[
    p[0]===0? cr+T.outline : p[0]===w? w-cr-T.outline : p[0],
    p[1]===0? cr+T.outline : p[1]===h? h-cr-T.outline : p[1]===h/2? h/2 : p[1]
  ]);
  const dark = adj(c,{dl:-17,ds:-4});
  const g = vGrad(c);
  let s = g.def;
  s += roundedPoly(pts, dark, {cr});
  // лицо — тот же полигон, поджатый снизу на bevel
  const face = pts.map(p=>[p[0], p[1] > h/2 ? p[1]-T.bevel : p[1]]);
  s += roundedPoly(face, c, {cr:cr*0.9, outline:false, fillOverride:g.fill});
  if(T.glossOn){
    const gpts = face.map(p=>[p[0]*0.98+w*0.01, p[1]<=h/2 ? p[1]+cr*0.4 : h*0.44]);
    s += `<path d="M${gpts.map(p=>p.join(',')).join('L')}Z" fill="#fff" opacity="${T.glossA/100}" stroke="#fff" stroke-width="${cr}" stroke-linejoin="round"/>`;
  }
  s += label(w/2, h/2-T.bevel/3, text, h*0.36);
  return {svg:svgDoc(w,h,s), w, h};
}

function compHexButton(colorId, iconName, size=110){
  const c = C(colorId);
  const cx=size/2, cy=size/2, R=size/2 - T.outline - 8;
  const cr = Math.min(9, T.radius*0.55);
  const hex = a0 => Array.from({length:6},(_,i)=>{
    const a=(i/6)*Math.PI*2 + a0;
    return [cx+Math.cos(a)*R, cy+Math.sin(a)*R];
  });
  const pts = hex(-Math.PI/2);
  const dark = adj(c,{dl:-17,ds:-4});
  const g = vGrad(c);
  let s = g.def;
  s += roundedPoly(pts, dark, {cr});
  const face = pts.map(p=>[cx+(p[0]-cx)*0.94, cy+(p[1]-cy)*0.94 - T.bevel*0.55]);
  s += roundedPoly(face, c, {cr:cr*0.85, outline:false, fillOverride:g.fill});
  if(T.glossOn){
    const gl = face.map(p=>[cx+(p[0]-cx)*0.8, p[1]<cy? cy+(p[1]-cy)*0.85 : cy*0.92]);
    s += `<path d="M${gl.map(p=>p.join(',')).join('L')}Z" fill="#fff" opacity="${T.glossA/100}" stroke="#fff" stroke-width="${cr}" stroke-linejoin="round"/>`;
  }
  s += icon(iconName, cx, cy - T.bevel*0.4, size*0.44);
  return {svg:svgDoc(size,size,s), w:size, h:size};
}

function compSquareIcon(colorId, iconName, size=92){

function compToggle(on, w=176, h=96){
  // как в референсе: приземистая пилюля-трек + крупный кноб, выступающий за трек
  const trackC = on ? adj(C("yellow"),{dh:-7, ds:6, dl:-3}) : adj(C("bluegray"),{dh:18, ds:-8, dl:-2});
  const knobC  = on ? "#ffffff" : adj(C("bluegray"),{dh:18, ds:-10, dl:8});
  const ow = Math.max(2, T.outline+1);
  const kr = h*0.42;                       // кноб больше трека
  const th = h*0.56;
  const tw = w - kr*0.9;
  const tx = (w-tw)/2, ty=(h-th)/2;
  let s = "";
  const gT = vGrad(trackC); s += gT.def;
  s += `<rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="${th/2}" fill="${gT.fill}" stroke="${DARK()}" stroke-width="${ow}"/>`;
  s += `<rect x="${tx+4}" y="${ty+th*0.62}" width="${tw-8}" height="${th*0.26}" rx="${th*0.13}" fill="#000" opacity="0.12"/>`;
  const kx = on ? tx+tw-th*0.42 : tx+th*0.42;
  const ky = h/2;
  const gK = vGrad(knobC); s += gK.def;
  s += `<circle cx="${kx}" cy="${ky}" r="${kr}" fill="${adj(knobC,{dl:-16})}" stroke="${DARK()}" stroke-width="${ow}"/>`;
  s += `<circle cx="${kx}" cy="${ky - T.bevel*0.35}" r="${Math.max(2,kr - T.bevel*0.35)}" fill="${gK.fill}"/>`;
  if(T.glossOn) s += `<ellipse cx="${kx}" cy="${ky-kr*0.45}" rx="${kr*0.55}" ry="${kr*0.26}" fill="#fff" opacity="${T.glossA/100+0.08}"/>`;
  return {svg:svgDoc(w,h,s), w, h};
}

function compCheckbox(on, size=88){

  const pad = size*0.2;
  const box = size - pad;
  const by = pad;
  const ow = Math.max(2, T.outline+0.5);

  if(on) s += icon("check", box*0.56, by+box*0.32, box*1.05, C("orange"));
  return {svg:svgDoc(size,size,s), w:size, h:size};
}

function compRadio(on, size=80){

function compTickSlider(pct, w=440, h=100){
  // слайдер из вертикальных тиков + белый вертикальный кноб-пилюля
  const n=17, m=24;
  const ticksW=w-m*2;
  const tw=Math.max(4, ticksW/n*0.4), gap=(ticksW-tw*n)/(n-1);
  const th=h*0.44, ty=(h-th)/2;
  const kxC = m + ticksW*pct/100;
  const ow = Math.max(1.5, T.outline);
  let s="";
  for(let i=0;i<n;i++){
    const x=m+i*(tw+gap);
    const filled = x+tw/2 < kxC;
    const c = filled ? adj(C("yellow"),{dh:-7,ds:6,dl:-3}) : adj(NAVY(),{dl:10});
    s += `<rect x="${x}" y="${ty}" width="${tw}" height="${th}" rx="${tw/2}" fill="${c}" stroke="${DARK()}" stroke-width="${Math.min(2,ow)}"/>`;
  }
  const kw=h*0.4, kh=h*0.88, ky=(h-kh)/2;
  const g=vGrad("#ffffff"); s+=g.def;
  s += `<rect x="${kxC-kw/2}" y="${ky+T.bevel*0.4}" width="${kw}" height="${kh-T.bevel*0.4}" rx="${kw/2}" fill="${adj('#ffffff',{dl:-20})}" stroke="${DARK()}" stroke-width="${Math.max(2,ow+0.5)}"/>`;
  s += `<rect x="${kxC-kw/2}" y="${ky}" width="${kw}" height="${kh-T.bevel*0.4}" rx="${kw/2}" fill="${g.fill}" stroke="${DARK()}" stroke-width="${Math.max(2,ow+0.5)}"/>`;
  const ah=6;
  s += `<path d="M${kxC-kw*0.14} ${h/2-ah} l${-ah} ${ah} l${ah} ${ah} M${kxC+kw*0.14} ${h/2-ah} l${ah} ${ah} l${-ah} ${ah}" stroke="#9aa5bd" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  return {svg:svgDoc(w,h,s), w, h};
}

function compProgress(pct, text, colorId="yellow", w=560, h=64){

    s += `<rect x="${pad}" y="${pad}" width="${fw}" height="${h-pad*2-T.bevel*0.7}" rx="${(T.radius*0.55)}" fill="${g.fill}"/>`;
    if(T.glossOn) s += `<rect x="${pad+4}" y="${pad+3}" width="${fw-8}" height="${(h-pad*2)*0.3}" rx="${(T.radius*0.4)}" fill="#fff" opacity="${T.glossA/100}"/>`;
  }

}

function compSegmentBar(filled, total, text, w=460, h=52){
  const c = C("yellow");
  let s = `<rect x="${T.outline/2}" y="${T.outline/2}" width="${w-T.outline}" height="${h-T.outline}" rx="${Math.min(10,T.radius*0.5)}" fill="${NAVY()}" stroke="${DARK()}" stroke-width="${T.outline}"/>`;

  const sw=(w-pad*2-gap*(total-1))/total;

    const x=pad+i*(sw+gap);
    if(i<filled){
      s += `<rect x="${x}" y="${pad}" width="${sw}" height="${h-pad*2}" rx="${Math.min(3,T.radius)}" fill="${adj(c,{dl:-15})}"/>`;
      s += `<rect x="${x}" y="${pad}" width="${sw}" height="${h-pad*2-4}" rx="${Math.min(3,T.radius)}" fill="${g.fill}"/>`;
    } else {
      s += `<rect x="${x}" y="${pad}" width="${sw}" height="${h-pad*2}" rx="${Math.min(3,T.radius)}" fill="#000" opacity="0.28"/>`;
    }
  }
  if(text) s += label(w/2, h/2, text, h*0.44);
  return {svg:svgDoc(w,h,s), w, h};
}

function compShield(num, size=88, colorId="sky"){
  const c=C(colorId), w=size, h=size*1.08;
  const pts=[[w*0.5,h*0.02],[w*0.93,h*0.16],[w*0.93,h*0.55],[w*0.5,h*0.97],[w*0.07,h*0.55],[w*0.07,h*0.16]];
  const cr=Math.min(7,T.radius*0.45);
  const dark=adj(c,{dl:-17,ds:-4});
  const g=vGrad(c);
  let s=g.def;
  s += roundedPoly(pts, dark, {cr});
  const face=pts.map(p=>[w/2+(p[0]-w/2)*0.9, h/2+(p[1]-h/2)*0.9 - T.bevel*0.4]);
  s += roundedPoly(face, c, {cr:cr*0.8, outline:false, fillOverride:g.fill});
  if(T.glossOn){
    const gl=face.filter(p=>p[1]<h*0.55);
    if(gl.length>2) s += `<path d="M${gl.map(p=>p.join(',')).join('L')}Z" fill="#fff" opacity="${T.glossA/100}" stroke="#fff" stroke-width="${cr}" stroke-linejoin="round"/>`;
  }
  s += label(w/2, h*0.47, String(num), size*0.5);
  return {svg:svgDoc(w,Math.ceil(h),s), w, h:Math.ceil(h)};
}

  // кнопка "+"
  const bs=h*0.7, bx=h*0.14, by2=(h-bs)/2;

  const ix=w-h*0.42, iy=h/2, ir=h*0.36;

  } else if(iconName==="gem"){
    const gc=C("purple");
    const pts=[[ix,iy-ir],[ix+ir*0.95,iy-ir*0.15],[ix,iy+ir],[ix-ir*0.95,iy-ir*0.15]];
    const g=vGrad(adj(gc,{dl:8,ds:6})); s+=g.def;
    s+=roundedPoly(pts, gc, {cr:2.5, fillOverride:g.fill});
    s+=`<path d="M${ix-ir*0.4},${iy-ir*0.35} L${ix},${iy-ir*0.7} L${ix+ir*0.15},${iy-ir*0.25} Z" fill="#fff" opacity="0.55"/>`;

    s += icon(iconName, ix, iy, ir*2.1);
  }
  return {svg:svgDoc(w,h,s), w, h};

function compTabBar(labels, active, w=520, h=84){

  return {svg:svgDoc(w,h,s), w, h};

/* ---------- тень компонента (пост-обработка): чёткая или размытая ---------- */
function shadowPad(){
  if(!T.shadowMode) return 0;
  const off = Math.max(Math.abs(T.shadowDx||0), Math.abs(T.shadowDy||0));
  return Math.ceil(off + (T.shadowMode===2 ? T.shadowBlur*2.2 : 0) + 2);
}
function withShadow(comp){
  if(!T.shadowMode) return comp;
  const p = shadowPad();
  const inner = comp.svg.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  const W = comp.w + p*2, H = comp.h + p*2;
  const id = uid("sh");
  const blur = T.shadowMode===2 ? T.shadowBlur : 0;
  const filt = `<filter id="${id}" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="${T.shadowDx}" dy="${T.shadowDy}" stdDeviation="${blur}" flood-color="${NAVY()}" flood-opacity="${(T.shadowA/100).toFixed(2)}"/></filter>`;
  return {
    name: comp.name, w: W, h: H,
    svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${filt}<g filter="url(#${id})" transform="translate(${p},${p})">${inner}</g></svg>`
  };
}

/* сборка всех компонентов; strip=true — без текста (для PNG: текст рисует движок) */
function buildAll(strip){
  STRIP_TEXT = !!strip;
  let all=[];
  try{ for(const t of TABS) all=all.concat(t.build().map(withShadow)); }
  finally{ STRIP_TEXT=false; }
  return all;
}

/* ---------- реестр компонентов по табам ---------- */
const TABS = [
  {id:"buttons", name:"Кнопки", build(){

      inp.addEventListener("input", e=>{
        T[c.k]=parseFloat(e.target.value);
        row.querySelector("output").textContent=e.target.value;
        render();
      });
    } else if(c.t==="check"){
      row.innerHTML = `<input type="checkbox" ${val?"checked":""} data-k="${c.k}" id="cb_${c.k}">
        <label class="cb-label" for="cb_${c.k}" style="flex:1">${c.label}</label>`;
      row.querySelector("input").addEventListener("change", e=>{

      });
    } else if(c.t==="select"){
      const selOf = (o,i)=>{
        if(c.k==="_preset") return o===currentPreset;
        if(c.k==="_bg") return o===previewBg;
        const v = c.values ? c.values[i] : o;
        return T[c.k]===v;
      };
      row.innerHTML = `<label>${c.label}</label>
        <select data-k="${c.k}">${c.options.map((o,i)=>`<option ${selOf(o,i)?"selected":""}>${o}</option>`).join("")}</select>`;
      row.querySelector("select").addEventListener("change", e=>{
        const i = e.target.selectedIndex;
        if(c.k==="_bg"){ previewBg=c.options[i]; applyBg(); }

        else { T[c.k] = c.values ? c.values[i] : c.options[i]; render(); }

    grpEl.appendChild(row);

function download(name, blob){
  const a=document.createElement("a");

/* кэш встраиваемых шрифтов для растеризации */
const fontCache={};
async function embeddedFontCss(){
  const key=T.font+":"+fontW();
  if(fontCache[key]) return fontCache[key];
  try{
    const famQ=T.font.replace(/ /g,"+");
    const cssUrl=`https://fonts.googleapis.com/css2?family=${famQ}:wght@${fontW()}&display=swap`;
    const css=await (await fetch(cssUrl)).text();
    // берём latin-блок (обычно последний с комментарием /* latin */)
    let block=null;
    const re=/\/\*\s*latin\s*\*\/\s*(@font-face\s*\{[^}]+\})/;
    const m=css.match(re);
    block = m ? m[1] : (css.match(/@font-face\s*\{[^}]+\}/)||[null])[0];
    if(!block) throw new Error("no font-face");
    const urlM=block.match(/url\((https:[^)]+)\)/);
    if(!urlM) throw new Error("no url");
    const buf=await (await fetch(urlM[1])).arrayBuffer();
    let bin=""; const bytes=new Uint8Array(buf);
    for(let i=0;i<bytes.length;i+=0x8000)
      bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
    const b64=btoa(bin);
    const out=`@font-face{font-family:'${T.font}';font-weight:${fontW()};src:url(data:font/woff2;base64,${b64}) format('woff2');}`;
    fontCache[key]=out;
    return out;
  }catch(e){
    console.warn("Не удалось встроить шрифт, экспорт с системным:", e);
    return "";
  }
}
function svgWithFont(svg, fontCss){
  if(!fontCss) return svg;
  return svg.replace(/^(<svg[^>]*>)/, `$1<defs><style>${fontCss}</style></defs>`);
}
function rasterize(svgStr, w, h, scale){
  return new Promise((res,rej)=>{
    const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      cv.width=Math.ceil(w*scale); cv.height=Math.ceil(h*scale);
      const ctx=cv.getContext("2d");
      ctx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv);
    };
    img.onerror=e=>{URL.revokeObjectURL(url); rej(e);};
    img.src=url;
  });
}
function downloadSvg(comp){
  embeddedFontCss().then(css=>{
    download(comp.name+".svg", new Blob([svgWithFont(comp.svg,css)],{type:"image/svg+xml"}));
  });
}
async function downloadPng(comp){
  const scale=parseFloat(document.getElementById("expScale").value);
  // пересобираем этот компонент без текста — надписи в игре рисует движок
  let bare = comp;

  try{
    const tab = TABS.find(t=>t.id===activeTab);
    bare = tab.build().map(withShadow).find(c=>c.name===comp.name) || comp;
  } finally { STRIP_TEXT = false; }
  const cv=await rasterize(bare.svg, bare.w, bare.h, scale);
  cv.toBlob(b=>download(comp.name+".png", b), "image/png");
}

/* экспорт всех SVG: выбор папки (File System Access API) или фолбэк на скачивания */
async function downloadAllSvg(){
  // папку спрашиваем сразу, пока жив user gesture
  let dir=null;
  if(window.showDirectoryPicker){
    try{ dir=await window.showDirectoryPicker({mode:"readwrite"}); }
    catch(e){ return; } // пользователь отменил
  }
  busy("Подготовка шрифта…");
  try{
    const css=await embeddedFontCss();
    const all=buildAll(false);
    if(dir){
      let i=0;
      for(const c of all){
        i++;
        busy(`Сохранение SVG ${i}/${all.length}: ${c.name}.svg`);
        const fh=await dir.getFileHandle(c.name+".svg",{create:true});
        const wr=await fh.createWritable();
        await wr.write(svgWithFont(c.svg,css));
        await wr.close();
      }
      toast(`${all.length} SVG сохранено в папку ✓`);
    } else {
      // фолбэк: браузер без showDirectoryPicker — последовательные скачивания
      for(let i=0;i<all.length;i++){
        busy(`Скачивание ${i+1}/${all.length}: ${all[i].name}.svg`);
        download(all[i].name+".svg", new Blob([svgWithFont(all[i].svg,css)],{type:"image/svg+xml"}));
        await new Promise(r=>setTimeout(r,220));
      }
      toast(`${all.length} SVG скачано ✓`);
    }
  }catch(e){
    console.error(e); toast("Ошибка экспорта SVG");
  }finally{ busyDone(); }
}

/* атлас: полочная упаковка + TexturePacker JSON hash */
async function exportAtlas(){
  const scale=parseFloat(document.getElementById("expScale").value);
  busy("Сборка компонентов…");
  try{
    // PNG-атлас — без текста (надписи в игре рисует движок), шрифт не нужен
    const all=buildAll(true);
    // растеризуем всё
    const items=[];
    for(let i=0;i<all.length;i++){
      const c=all[i];
      busy(`Растеризация ${i+1}/${all.length}: ${c.name}`);
      const cv=await rasterize(c.svg, c.w, c.h, scale);
      items.push({name:c.name, cv, w:cv.width, h:cv.height, sw:c.w, sh:c.h});
    }
    busy("Упаковка атласа…");
    // полочная упаковка
    const PAD=2, MAXW=2048*Math.min(scale,2);
    items.sort((a,b)=>b.h-a.h);
    let x=PAD, y=PAD, rowH=0, usedW=0;
    for(const it of items){
      if(x+it.w+PAD>MAXW){ x=PAD; y+=rowH+PAD; rowH=0; }
      it.x=x; it.y=y;
      x+=it.w+PAD;
      rowH=Math.max(rowH,it.h);
      usedW=Math.max(usedW,it.x+it.w+PAD);
    }
    const totalH=y+rowH+PAD;
    const atlas=document.createElement("canvas");
    atlas.width=usedW; atlas.height=totalH;
    const ctx=atlas.getContext("2d");
    const frames={};
    for(const it of items){
      ctx.drawImage(it.cv,it.x,it.y);
      frames[it.name]={
        frame:{x:it.x,y:it.y,w:it.w,h:it.h},
        rotated:false, trimmed:false,
        spriteSourceSize:{x:0,y:0,w:it.w,h:it.h},
        sourceSize:{w:it.w,h:it.h}
      };
    }
    const json={
      frames,
      meta:{
        app:"UI Kit Forge", version:"1.0",
        image:"uikit.png", format:"RGBA8888",
        size:{w:atlas.width,h:atlas.height},
        scale:String(scale),
        theme:{...T}
      }
    };
    atlas.toBlob(b=>download("uikit.png",b),"image/png");
    download("uikit.json", new Blob([JSON.stringify(json,null,2)],{type:"application/json"}));
    toast(`Атлас ${atlas.width}×${atlas.height}, ${items.length} спрайтов ✓`);
  }catch(e){
    console.error(e); toast("Ошибка сборки атласа");
  }finally{ busyDone(); }
}

/* ---------- тема: копирование / вставка ---------- */
async function copyTheme(){
  const txt=JSON.stringify(T,null,2);
  try{ await navigator.clipboard.writeText(txt); toast("Тема скопирована в буфер"); }
  catch(e){ download("theme.json", new Blob([txt],{type:"application/json"})); }
}
function pasteTheme(){
  const txt=prompt("Вставьте JSON темы:");
  if(!txt) return;
  try{
    const obj=JSON.parse(txt);
    // совместимость со старыми темами (единое смещение тени)
    if(obj.shadowOff!=null && obj.shadowDx==null){
      obj.shadowDx=Math.round(obj.shadowOff*0.45);
      obj.shadowDy=obj.shadowOff;
      delete obj.shadowOff;
    }
    T={...DEFAULT_THEME, ...obj};
    buildControls(); render();
    toast("Тема применена ✓");
  }catch(e){ toast("Ошибка: невалидный JSON"); }
}

/* ---------- init ---------- */
document.getElementById("btnRandom").onclick=randomize;
document.getElementById("btnReset").onclick=()=>{T={...DEFAULT_THEME}; currentPreset="Стандарт"; buildControls(); render(); toast("Настройки сброшены");};
document.getElementById("btnAtlas").onclick=exportAtlas;
document.getElementById("btnAllSvg").onclick=downloadAllSvg;
document.getElementById("btnHtml").onclick=exportHtml;
document.getElementById("btnThemeCopy").onclick=copyTheme;
document.getElementById("btnThemePaste").onclick=pasteTheme;

buildControls();
buildTabs();
applyBg();
// дождёмся шрифтов для корректного превью
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(render);
  setTimeout(render, 50);
} else render();
</script>
