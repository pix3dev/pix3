name: Deploy Collab Server

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-collab-server.yml'
      - 'packages/pix3-collab-server/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-collab-server-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy collab backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      DEPLOY_HOST: cloud.pix3.dev
      DEPLOY_PORT: ${{ secrets.COLLAB_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.COLLAB_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.COLLAB_DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build collab server
        run: npm run build -w packages/pix3-collab-server

      - name: Prepare release bundle
        run: |
          set -euo pipefail
          RELEASE_DIR=".deploy/pix3-collab-server"
          rm -rf "$RELEASE_DIR"
          mkdir -p \
            "$RELEASE_DIR/packages/pix3-collab-server/dist" \
            "$RELEASE_DIR/packages/pix3-collab-server/src/admin"

          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); delete pkg.scripts?.postinstall; fs.writeFileSync(process.argv[1], JSON.stringify(pkg, null, 2) + '\n');" "$RELEASE_DIR/package.json"
          cp package-lock.json "$RELEASE_DIR/package-lock.json"
          cp packages/pix3-collab-server/package.json \
            "$RELEASE_DIR/packages/pix3-collab-server/package.json"
          cp -R packages/pix3-collab-server/dist/. \
            "$RELEASE_DIR/packages/pix3-collab-server/dist/"
          cp packages/pix3-collab-server/src/admin/index.html \
            "$RELEASE_DIR/packages/pix3-collab-server/src/admin/index.html"

          tar -C .deploy -czf .deploy/pix3-collab-server.tar.gz pix3-collab-server

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.COLLAB_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Room Fabric wiring, delivered from the `production` environment instead of living only in
      # the host's hand-edited shared/.env. `/api/rooms` answers 503 unless BOTH ROOMS_ADMIN_URL
      # and ROOMS_SERVICE_TOKEN are set, so a config that is only reachable over SSH is a config
      # that stays unset. Runs BEFORE the release step, which is what restarts the service.
      #
      # An empty value is SKIPPED, never written: writing ROOMS_SERVICE_TOKEN= would silently
      # disable room minting on a host where the token was already correct.
      #
      # The merge script goes over first and the VALUES follow on its stdin — never in argv (any
      # user on the host can read /proc/*/cmdline), never in a file of their own (a cancelled run
      # between two ssh calls would leave the token lying in /tmp), never in the log.
      - name: Sync Room Fabric settings into shared/.env
        env:
          ROOMS_ADMIN_URL: ${{ vars.ROOMS_ADMIN_URL || 'https://rooms.pix3.dev' }}
          ROOMS_WS_URL: ${{ vars.ROOMS_WS_URL }}
          ROOMS_SERVICE_TOKEN: ${{ secrets.ROOMS_SERVICE_TOKEN }}
          ROOMS_JWT_SECRET: ${{ secrets.ROOMS_JWT_SECRET }}
        run: |
          set -euo pipefail
          FRAGMENT="$(mktemp)"
          chmod 600 "$FRAGMENT"
          for key in ROOMS_ADMIN_URL ROOMS_WS_URL ROOMS_SERVICE_TOKEN ROOMS_JWT_SECRET; do
            value="${!key}"
            if [ -n "${value}" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$FRAGMENT"
              echo "will set ${key}"
            fi
          done

          if [ ! -s "$FRAGMENT" ]; then
            echo "::warning::No ROOMS_* values configured; leaving shared/.env untouched."
            exit 0
          fi
          if ! grep -q '^ROOMS_SERVICE_TOKEN=' "$FRAGMENT"; then
            echo "::warning::ROOMS_SERVICE_TOKEN is not set in the production environment. Room minting stays disabled unless shared/.env already carries it. It must equal Rooms__Auth__ServiceToken on the fabric."
          fi

          REMOTE_SCRIPT="/tmp/pix3-rooms-env-merge-${GITHUB_SHA}.sh"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; cat > '${REMOTE_SCRIPT}'" <<'EOF'
          set -euo pipefail

          ENV_FILE="${DEPLOY_ROOT}/shared/.env"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "Missing shared/.env on remote host" >&2
            exit 1
          fi

          umask 077
          FRAGMENT="$(mktemp)"
          MERGED="$(mktemp)"
          trap 'rm -f "${FRAGMENT}" "${MERGED}" "$0"' EXIT

          cat > "${FRAGMENT}"

          # Drop the keys about to be rewritten, keep every other line verbatim (comments included).
          KEY_PATTERN="^($(cut -d= -f1 "${FRAGMENT}" | paste -sd'|' -))="
          grep -v -E "${KEY_PATTERN}" "${ENV_FILE}" > "${MERGED}" || true
          cat "${FRAGMENT}" >> "${MERGED}"
          # Redirect INTO the existing file rather than mv over it, so owner/mode survive.
          cat "${MERGED}" > "${ENV_FILE}"

          echo "shared/.env keys: $(cut -d= -f1 "${ENV_FILE}" | grep -v '^#' | sort | paste -sd' ' -)"
          EOF

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_PATH}' bash '${REMOTE_SCRIPT}'" < "$FRAGMENT"
          rm -f "$FRAGMENT"

      - name: Upload release bundle
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_PORT:-22}" .deploy/pix3-collab-server.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/pix3-collab-server-${GITHUB_SHA}.tar.gz"

      - name: Deploy release on server
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_PATH}' RELEASE_SHA='${GITHUB_SHA}' bash -s" <<'EOF'
          set -euo pipefail

          RELEASE_DIR="${DEPLOY_ROOT}/releases/${RELEASE_SHA}"
          APP_DIR="${RELEASE_DIR}/packages/pix3-collab-server"
          SHARED_DIR="${DEPLOY_ROOT}/shared"
          ARCHIVE_PATH="/tmp/pix3-collab-server-${RELEASE_SHA}.tar.gz"

          mkdir -p "${DEPLOY_ROOT}/releases" "${SHARED_DIR}/data"
          rm -rf "${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"

          tar -xzf "${ARCHIVE_PATH}" -C "${RELEASE_DIR}" --strip-components=1
          rm -f "${ARCHIVE_PATH}"

          if [ ! -f "${SHARED_DIR}/.env" ]; then
            echo "Missing ${SHARED_DIR}/.env on remote host" >&2
            exit 1
          fi

          rm -rf "${APP_DIR}/data"
          ln -sfn "${SHARED_DIR}/data" "${APP_DIR}/data"
          ln -sfn "${SHARED_DIR}/.env" "${APP_DIR}/.env"

          cd "${RELEASE_DIR}"
          npm ci --omit=dev --workspace packages/pix3-collab-server

          ln -sfn "${APP_DIR}" "${DEPLOY_ROOT}/current"

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart pix3-collab-server
          systemctl --user --no-pager --full status pix3-collab-server | head -n 20

          ls -1dt "${DEPLOY_ROOT}"/releases/* | tail -n +6 | xargs -r rm -rf
          EOF
